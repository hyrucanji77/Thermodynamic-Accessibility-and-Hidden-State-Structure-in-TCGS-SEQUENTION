name: Reproduce v4 calculations
on:
  push:
    branches: [main]
    paths:
      - 'code/**'
      - 'tools/fetch_publisher_inputs.py'
      - 'requirements.txt'
      - 'REFERENCE_MANIFEST.sha256'
      - '.github/workflows/reproduce.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
      - name: Install declared numerical dependencies
        run: python -m pip install -r requirements.txt
      - name: Retrieve exact publisher workbooks
        run: python tools/fetch_publisher_inputs.py
      - name: Reproduce all 105 checks and four figures
        run: |
          python code/reproduce.py
          python code/label_resolution.py
      - name: Retrieve exact publisher PDFs when available
        continue-on-error: true
        run: python tools/fetch_publisher_inputs.py --with-papers
      - name: Commit verified inputs and reproduced outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data results figures
          if [ -d references ]; then git add references; fi
          if ! git diff --cached --quiet; then
            git commit -m 'Add checksum-verified publisher inputs and reproduced v4 results'
            git push origin HEAD:main
          fi
